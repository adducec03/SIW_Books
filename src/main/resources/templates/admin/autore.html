
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/autore.css?version=3" />

    <title>Dettagli Autore - SIW Books</title>
    
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo-link">
                <span>SIW Books</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/libri" class="nav-link">Catalogo</a>
                <a href="/autori" class="nav-link">Autori</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Author Details -->
        <div th:if="${autore}" class="author-details">
            <div class="author-hero">
                <div class="author-image-container">
                    <img th:if="${autore.percorsoImmagine != null and !autore.percorsoImmagine.isEmpty()}"
                         th:src="${autore.percorsoImmagine}" 
                         th:alt="'Foto di ' + ${autore.nome} + ' ' + ${autore.cognome}"
                         class="author-image" />
                    <div th:unless="${autore.percorsoImmagine != null and !autore.percorsoImmagine.isEmpty()}"
                         class="author-placeholder"
                         th:text="${autore.nome.substring(0,1) + autore.cognome.substring(0,1)}">
                        AB
                    </div>
                </div>

                <div class="author-info">
                    <h1 class="author-name" th:text="${autore.nome} + ' ' + ${autore.cognome}">Nome Cognome</h1>
                    
                    <div class="author-meta">
                        <div class="meta-item">
                            <div class="meta-icon">🎂</div>
                            <span class="meta-label">Data di nascita:</span>
                            <span class="meta-value" th:text="${#temporals.format(autore.dataNascita, 'dd/MM/yyyy')}">1/1/1900</span>
                        </div>
                        
                        <div th:if="${autore.dataMorte != null}" class="meta-item">
                            <div class="meta-icon">⚰️</div>
                            <span class="meta-label">Data di morte:</span>
                            <span class="meta-value" th:text="${#temporals.format(autore.dataMorte, 'dd/MM/yyyy')}">1/1/1900</span>
                        </div>
                        
                        <div class="meta-item">
                            <div class="meta-icon">🌍</div>
                            <span class="meta-label">Nazionalità:</span>
                            <span class="meta-value" th:text="${autore.nazionalita}">Italiano</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Biography Section -->
        <div th:if="${autore != null and autore.descrizione != null and !autore.descrizione.isEmpty()}" class="biography-section">
            <h2 class="biography-title">
                📖 Biografia
            </h2>
            <p class="biography-text" th:text="${autore.descrizione}">Testo della descrizione</p>
        </div>

        <!-- Action Buttons -->
        <div th:if="${autore}" class="action-buttons">
            <a th:href="@{'/admin/autore/' + ${autore.id} + '/modifica'}" class="btn btn-primary">
                ✏️ Modifica Autore
            </a>
            <form th:action="@{'/admin/autore/' + ${autore.id} + '/elimina'}" method="post" style="display: inline;"
                  onsubmit="return confirm('Sei sicuro di voler eliminare questo autore? Verranno eliminati anche i suoi libri.')">
                <button type="submit" class="btn btn-danger">
                    🗑️ Elimina Autore
                </button>
            </form>
        </div>

        <!-- Not Found State -->
        <div th:unless="${autore}" class="not-found">
            <div class="not-found-icon">
                ❌
            </div>
            <h2 class="not-found-title">Autore non trovato</h2>
            <p class="not-found-description">L'autore che stai cercando non esiste nel sistema.</p>
            <a href="/autori" class="btn btn-primary">
                🔙 Torna agli Autori
            </a>
        </div>
    </main>
</body>

</html>
