
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettagli Autore - SIW Books</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffe6a7;
            color: #432818;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #432818 0%, #99582a 100%);
            padding: 1.5rem 0;
            box-shadow: 0 4px 20px rgba(67, 40, 24, 0.15);
            margin-bottom: 2rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffe6a7;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .logo {
            height: 50px;
            width: auto;
            margin-right: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            margin-left: auto;
        }

        .nav-link {
            color: #ffe6a7;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover {
            background-color: rgba(255, 230, 167, 0.1);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Author Details */
        .author-details {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(67, 40, 24, 0.15);
            border: 2px solid rgba(153, 88, 42, 0.1);
            margin-bottom: 2rem;
        }

        .author-hero {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 3rem;
            padding: 3rem;
            align-items: start;
        }

        .author-image-container {
            position: relative;
        }

        .author-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(67, 40, 24, 0.2);
            border: 3px solid rgba(153, 88, 42, 0.2);
        }

        .author-placeholder {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #99582a 0%, #6f1d1b 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 32px rgba(67, 40, 24, 0.2);
        }

        .author-info {
            padding-top: 1rem;
        }

        .author-name {
            font-size: 3rem;
            font-weight: 700;
            color: #432818;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(67, 40, 24, 0.1);
        }

        .author-meta {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: rgba(255, 230, 167, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(153, 88, 42, 0.2);
        }

        .meta-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #99582a;
            color: white;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .meta-label {
            font-weight: 600;
            color: #432818;
            min-width: 120px;
        }

        .meta-value {
            color: #99582a;
            font-weight: 500;
        }

        /* Biography Section */
        .biography-section {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(67, 40, 24, 0.1);
            border: 2px solid rgba(153, 88, 42, 0.1);
            margin-bottom: 2rem;
        }

        .biography-title {
            font-size: 2rem;
            font-weight: 600;
            color: #432818;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .biography-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #432818;
            text-align: justify;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #99582a 0%, #6f1d1b 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(153, 88, 42, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.3);
        }

        /* Not Found State */
        .not-found {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(67, 40, 24, 0.1);
            border: 2px solid rgba(153, 88, 42, 0.1);
        }

        .not-found-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: #ffe6a7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #99582a;
        }

        .not-found-title {
            font-size: 2rem;
            font-weight: 600;
            color: #432818;
            margin-bottom: 1rem;
        }

        .not-found-description {
            color: #99582a;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .author-hero {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 2rem;
                text-align: center;
            }

            .author-image,
            .author-placeholder {
                height: 300px;
                max-width: 300px;
                margin: 0 auto;
            }

            .author-name {
                font-size: 2.5rem;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .header-container {
                padding: 0 1rem;
            }

            .main-content {
                padding: 0 1rem;
            }

            .nav-links {
                display: none;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .author-details,
        .biography-section {
            animation: fadeInUp 0.6s ease forwards;
        }

        .biography-section {
            animation-delay: 0.2s;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo-link">
                <span>SIW Books</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/libri" class="nav-link">Catalogo</a>
                <a href="/autori" class="nav-link">Autori</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Author Details -->
        <div th:if="${autore}" class="author-details">
            <div class="author-hero">
                <div class="author-image-container">
                    <img th:if="${autore.percorsoImmagine != null and !autore.percorsoImmagine.isEmpty()}"
                         th:src="${autore.percorsoImmagine}" 
                         th:alt="'Foto di ' + ${autore.nome} + ' ' + ${autore.cognome}"
                         class="author-image" />
                    <div th:unless="${autore.percorsoImmagine != null and !autore.percorsoImmagine.isEmpty()}"
                         class="author-placeholder"
                         th:text="${autore.nome.substring(0,1) + autore.cognome.substring(0,1)}">
                        AB
                    </div>
                </div>

                <div class="author-info">
                    <h1 class="author-name" th:text="${autore.nome} + ' ' + ${autore.cognome}">Nome Cognome</h1>
                    
                    <div class="author-meta">
                        <div class="meta-item">
                            <div class="meta-icon">🎂</div>
                            <span class="meta-label">Data di nascita:</span>
                            <span class="meta-value" th:text="${#temporals.format(autore.dataNascita, 'dd/MM/yyyy')}">1/1/1900</span>
                        </div>
                        
                        <div th:if="${autore.dataMorte != null}" class="meta-item">
                            <div class="meta-icon">⚰️</div>
                            <span class="meta-label">Data di morte:</span>
                            <span class="meta-value" th:text="${#temporals.format(autore.dataMorte, 'dd/MM/yyyy')}">1/1/1900</span>
                        </div>
                        
                        <div class="meta-item">
                            <div class="meta-icon">🌍</div>
                            <span class="meta-label">Nazionalità:</span>
                            <span class="meta-value" th:text="${autore.nazionalita}">Italiano</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Biography Section -->
        <div th:if="${autore != null and autore.descrizione != null and !autore.descrizione.isEmpty()}" class="biography-section">
            <h2 class="biography-title">
                📖 Biografia
            </h2>
            <p class="biography-text" th:text="${autore.descrizione}">Testo della descrizione</p>
        </div>

        <!-- Action Buttons -->
        <div th:if="${autore}" class="action-buttons">
            <a th:href="@{'/admin/autore/' + ${autore.id} + '/modifica'}" class="btn btn-primary">
                ✏️ Modifica Autore
            </a>
            <form th:action="@{'/admin/autore/' + ${autore.id} + '/elimina'}" method="post" style="display: inline;"
                  onsubmit="return confirm('Sei sicuro di voler eliminare questo autore? Verranno eliminati anche i suoi libri.')">
                <button type="submit" class="btn btn-danger">
                    🗑️ Elimina Autore
                </button>
            </form>
        </div>

        <!-- Not Found State -->
        <div th:unless="${autore}" class="not-found">
            <div class="not-found-icon">
                ❌
            </div>
            <h2 class="not-found-title">Autore non trovato</h2>
            <p class="not-found-description">L'autore che stai cercando non esiste nel sistema.</p>
            <a href="/autori" class="btn btn-primary">
                🔙 Torna agli Autori
            </a>
        </div>
    </main>
</body>

</html>
