<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>New Autore</title>
    <link rel="stylesheet" href="/stile.css?version=3" />
</head>

<body>
    <div><a href="/"><img src="/logo.png" width="10%" /></a></div>
    <h1>Aggiungi un autore</h1>


    <form th:action="@{/autore}" method="POST" th:object="${autore}" enctype="multipart/form-data">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div>
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </div>

        <div>
            <label>Cognome:</label>
            <input type="text" th:field="*{cognome}" />
            <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></span>
        </div>

        <div>
            <label>Data di nascita:</label>
            <input type="date" th:field="*{dataNascita}" />
            <span th:if="${#fields.hasErrors('dataNascita')}" th:errors="*{dataNascita}"></span>
        </div>

        <div>
            <label><input type="checkbox" id="inVitaCheckbox" onchange="toggleDataMorte()" /> Autore ancora in
                vita</label>
        </div>

        <div id="dataMorteContainer">
            <label>Data di morte:</label>
            <input type="date" th:field="*{dataMorte}" />
        </div>

        <script>
            function toggleDataMorte() {
                const checkbox = document.getElementById("inVitaCheckbox");
                const dataMorteContainer = document.getElementById("dataMorteContainer");
                const input = dataMorteContainer.querySelector("input");

                if (checkbox.checked) {
                    dataMorteContainer.style.display = "none";
                    input.value = ""; // cancella eventuale valore
                } else {
                    dataMorteContainer.style.display = "block";
                }
            }
        </script>

        <div>
            <label>Nazionalità:</label>
            <input type="text" th:field="*{nazionalita}" />
            <span th:if="${#fields.hasErrors('nazionalita')}" th:errors="*{nazionalita}"></span>
        </div>

        <div class="form-group">
            <label for="immagini" class="form-label">Immagine autore</label>
            <div class="file-input-container">
                <input type="file" id="immagine" name="immagine" accept="image/*" class="file-input">
                <label for="immagine" class="file-input-label">
                    <span class="file-icon">📷</span>
                    Seleziona un immagine
                </label>
            </div>
            <small style="color: var(--secondary-color); font-size: 0.875rem; margin-top: 0.25rem; display: block;">
                Formati supportati: JPG, PNG, GIF. Massimo 5MB per immagine.
            </small>
        </div>
        <div>


            <label>Descrizione:</label>
            <textarea th:field="*{descrizione}" rows="6" cols="50"></textarea>
            <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"></span>
        </div>


        <div>
            <button type="submit">Conferma</button>
        </div>
    </form>


    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            const fileInput = document.getElementById("immagine");
            console.log("File selezionato:", fileInput.files[0]);
        });
    </script>
</body>

</html>
