<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Nuovo Libro - SIW Books</title>
    <link rel="stylesheet" href="/css/formNewLibroAndAutore.css?version=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo-container">
                <span class="brand-text">SIW Books</span>
            </a>
            <nav>
                <a href="/libri" class="nav-link">Torna al Catalogo</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">


        <div class="form-container">
            <div class="page-header">
                <h1 class="page-title">Aggiungi Nuovo Libro</h1>
                <p class="page-subtitle">Inserisci i dettagli del libro nel sistema</p>
            </div>
            <!-- Global Errors -->
            <!--<div th:if="${#fields.hasGlobalErrors()}" class="global-errors">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore globale</p>
            </div>-->

            <form th:action="@{/libro}" method="POST" th:object="${libro}" enctype="multipart/form-data">
                <!-- Title and Year Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="titolo" class="form-label">Titolo *</label>
                        <input type="text" id="titolo" th:field="*{titolo}" class="form-input"
                            placeholder="Inserisci il titolo del libro" required>
                        <span th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="anno" class="form-label">Anno di Pubblicazione *</label>
                        <input type="number" id="anno" th:field="*{anno}" class="form-input" placeholder="es. 2023"
                            min="1" max="2024" required>
                        <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="field-error"></span>
                    </div>
                </div>

                <!-- Genre -->
                <div class="form-group">
                    <label for="genere" class="form-label">Genere *</label>
                    <input type="text" id="genere" th:field="*{genere}" class="form-input"
                        placeholder="es. Fantasy, Romanzo, Giallo, Biografia" required>
                    <span th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}" class="field-error"></span>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="descrizione" class="form-label">Descrizione</label>
                    <textarea id="descrizione" th:field="*{descrizione}" class="form-input form-textarea"
                        placeholder="Inserisci una breve descrizione del libro, trama o riassunto..."></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"
                        class="field-error"></span>
                </div>

                <!-- Authors Selection -->
                <div class="form-group">
                    <label for="autori" class="form-label">Seleziona Autori *</label>
                    <select id="autori" name="autori" multiple size="5" class="form-input form-select" required>
                        <option th:each="autore : ${autori}" th:value="${autore.id}"
                            th:text="${autore.nome + ' ' + autore.cognome}">
                            Autore Nome
                        </option>
                    </select>
                    <small
                        style="color: var(--secondary-color); font-size: 0.875rem; margin-top: 0.25rem; display: block;">
                        Tieni premuto Ctrl (o Cmd su Mac) per selezionare più autori
                    </small>
                </div>

                <!-- Image Upload -->
                <div class="form-group">
                    <label for="immagini" class="form-label">Immagini del Libro</label>
                    <div class="file-input-container">
                        <input type="file" id="immagini" name="immagini" multiple accept="image/*" class="file-input">
                        <label for="immagini" class="file-input-label">
                            <span class="file-icon">📷</span>
                            Seleziona immagini (copertina, retro, etc.)
                        </label>
                    </div>
                    <small
                        style="color: var(--secondary-color); font-size: 0.875rem; margin-top: 0.25rem; display: block;">
                        Formati supportati: JPG, PNG, GIF. Massimo 5MB per immagine.
                    </small>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <a href="/libri" class="btn btn-secondary">Annulla</a>
                    <button type="submit" class="btn btn-primary">
                        Aggiungi Libro
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // File input enhancement
        document.getElementById('immagini').addEventListener('change', function (e) {
            const label = document.querySelector('.file-input-label');
            const fileCount = e.target.files.length;

            if (fileCount > 0) {
                const labelText = fileCount === 1
                    ? '1 file selezionato'
                    : `${fileCount} file selezionati`;
                label.innerHTML = `<span class="file-icon">📷</span> ${labelText}`;
                label.style.borderColor = 'var(--success-color)';
                label.style.color = 'var(--success-color)';
            } else {
                label.innerHTML = '<span class="file-icon">📷</span> Seleziona immagini (copertina, retro, etc.)';
                label.style.borderColor = 'var(--border-color)';
                label.style.color = 'var(--secondary-color)';
            }
        });

        // Form validation enhancement
        document.querySelector('form').addEventListener('submit', function (e) {
            const requiredFields = document.querySelectorAll('input[required], select[required]');
            let hasErrors = false;

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = 'var(--error-color)';
                    hasErrors = true;
                } else {
                    field.style.borderColor = 'var(--border-color)';
                }
            });

            if (hasErrors) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>

</html>
