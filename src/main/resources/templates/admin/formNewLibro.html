<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>New Libro</title>
    <link rel="stylesheet" href="/formNewLibro.css?version=3" />
</head>

<body>
    <div><a href="/"><img src="/logo.png" width="10%" /></a></div>
    <h1>Aggiungi un libro</h1>


    <form th:action="@{/libro}" method="POST" th:object="${libro}">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div>
            <label>Titolo:</label>
            <input type="text" th:field="*{titolo}" />
            <span th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}"></span>
        </div>

        <div>
            <label>Anno:</label>
            <input type="text" th:field="*{anno}" />
            <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></span>
        </div>

        <div>
            <label>Anno:</label>
            <input type="text" th:field="*{genere}" />
            <span th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}"></span>
        </div>

        <div id="immagini-container">
            <label>URL immagine:</label>
            <input type="url" name="urlImmagini" />
        </div>
        <button type="button" onclick="aggiungiCampo()">Aggiungi immagine</button>

        <script>
            function aggiungiCampo() {
                const container = document.getElementById('immagini-container');
                const input = document.createElement('input');
                input.type = 'url';
                input.name = 'urlImmagini'; // Spring li mapperà in una lista
                container.appendChild(document.createElement('br'));
                container.appendChild(input);
            }
        </script>

        <!-- Se vuoi visualizzare gli autori -->
        <div th:if="${autori != null}">
            <label>Autori:</label>
            <select th:field="*{autori}" multiple>
                <option th:each="autore : ${autori}" th:value="${autore.id}"
                    th:text="${autore.nome + ' ' + autore.cognome}">
                </option>
            </select>
        </div>

        <div>
            <button type="submit">Conferma</button>
        </div>
    </form>
</body>

</html>
