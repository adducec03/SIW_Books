<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreria Digitale - Elenco Libri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/libri.css">
</head>

<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <a href="/" class="logo">
                    SIW Books
                </a>
            </div>

            <div class="navbar-nav">
                <a href="/">Home</a>
                <a href="/libri" class="active">Libri</a>
                <a href="/autori">Autori</a>
            </div>

            <div class="navbar-auth">
                <span class="not-auth" th:if="${not #authorization.expression('isAuthenticated()')}">
                    <a href="/login">Login</a>
                    <a href="/register" class="btn-register">Register</a>
                </span>
                <div th:if="${nomeUtente != null}">
                    <div class="profile-dropdown">
                        <div class="profile-icon" id="profileToggle">
                            <!-- Icona utente -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="28" height="28"
                                viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>

                            <span>Ciao, <span th:text="${nomeUtente}">Utente</span></span>
                        </div>
                        <div class="profile-menu" id="profileDropdown">
                            <a th:href="@{/areaPersonale}">
                                <!-- Icona impostazioni -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="20" height="20"
                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"
                                    style="vertical-align: middle; margin-right: 8px;">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                                </svg>


                                Area Personale
                            </a>

                            <a th:href="@{/logout}">
                                <!-- Icona logout -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24"
                                    style="vertical-align: middle; margin-right: 8px;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <!-- Sidebar -->
        <aside class="sidebar fade-in">
            <div class="sidebar-header">
                <h2>
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    Catalogo
                </h2>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3>Filtri</h3>
                    <ul>
                        <li>
                            <a th:href="@{/libri}"
                                th:classappend="${filtro == 'recenti' or filtro == null} ? ' active-filter' : ''"
                                class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="28" height="28"
                                    stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg> Recenti
                            </a>
                        </li>

                        <li>
                            <a th:href="@{/libri/piu-votati}"
                                th:classappend="${filtro == 'votati'} ? ' active-filter' : ''" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="28" height="28"
                                    stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                                </svg> Più votati
                            </a>
                        </li>

                        <li>
                            <a th:href="@{/libri/salvati}"
                                th:classappend="${filtro == 'salvati'} ? ' active-filter' : ''" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="28" height="28"
                                    stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                                </svg> Più salvati
                            </a>
                        </li>
                    </ul>
                </div>


                <h3>Amministrazione</h3>
                <ul>
                    <li><a th:href="@{/admin/formNewLibro}" class="nav-link">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            Aggiungi Libro
                        </a></li>
                </ul>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content fade-in">
            <div class="content-header">
                <div class="header-title">
                    <h1>Libreria Digitale</h1>
                    <p>Esplora la nostra collezione di libri</p>
                </div>

                <div class="header-stats">
                    <div class="stat-card">
                        <span class="stat-number" th:text="${#lists.size(libri)}">0</span>
                        <span class="stat-label">Libri trovati</span>
                    </div>
                </div>
            </div>

            <!-- Error Messages -->
            <div th:if="${globalError != null}" class="alert alert-error">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p th:text="${globalError}"></p>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <h2>
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    Ricerca Avanzata
                </h2>

                <form th:action="@{/libri}" method="get" class="search-form">
                    <div class="search-grid">
                        <div class="form-group">
                            <label for="titolo">Titolo</label>
                            <input type="text" id="titolo" name="titolo" placeholder="Inserisci il titolo del libro"
                                th:value="${param.titolo}">
                        </div>

                        <div class="form-group">
                            <label for="autore">Autore</label>
                            <input type="text" id="autore" name="autore" placeholder="Nome dell'autore"
                                th:value="${param.autore}">
                        </div>

                        <div class="form-group">
                            <label for="anno">Anno</label>
                            <input type="number" id="anno" name="anno" placeholder="Anno di pubblicazione"
                                th:value="${param.anno}">
                        </div>

                        <div class="form-group">
                            <label for="genere">Genere</label>
                            <input type="text" id="genere" name="genere" placeholder="Genere letterario"
                                th:value="${param.genere}">
                        </div>
                    </div>

                    <div class="search-actions">
                        <button type="submit" class="btn btn-primary">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            Cerca Libri
                        </button>
                        <a th:href="@{/libri}" class="btn btn-secondary">Cancella Filtri</a>
                    </div>
                </form>
            </div>

            <!-- Books Grid Section -->
            <div th:replace="admin/fragments/libri :: libriFragment(${libri}, ${stelle})"></div>
        </main>
    </div>

    <script>
        // Toggle sidebar on mobile
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('active');
        }

        // Mobile responsive behavior
        window.addEventListener('resize', function () {
            const sidebar = document.querySelector('.sidebar');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('active');
            }
        });

        function caricaLibri(tipo) {
            fetch(`/libri/frammento?tipo=${tipo}`)
                .then(res => res.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const nuovo = doc.querySelector(".books-grid") || doc.querySelector(".empty-state");

                    const vecchiaSezione = document.querySelector(".books-grid") || document.querySelector(".empty-state");
                    if (vecchiaSezione && nuovo) {
                        vecchiaSezione.replaceWith(nuovo);
                    }

                    // Aggiorna anche il contatore "Libri trovati"
                    const count = nuovo?.querySelectorAll('.book-card').length || 0;
                    const contatore = document.querySelector('.stat-number');
                    if (contatore) contatore.textContent = count;
                })
                .catch(err => console.error("Errore nel caricamento:", err));
        }

        document.addEventListener('DOMContentLoaded', function () {
            const toggle = document.getElementById('profileToggle');
            const dropdown = document.getElementById('profileDropdown');

            if (toggle && dropdown) {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
                });

                document.addEventListener('click', function () {
                    dropdown.style.display = 'none';
                });
            }
        });
    </script>
</body>

</html>
