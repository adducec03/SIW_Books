<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Autore</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container">
        <h1>Modifica Autore</h1>

        <!-- Mostra errore se presente -->
        <div th:if="${dataError}" class="error-message" style="color: red;">
            <p th:text="${dataError}"></p>
        </div>

        <form th:action="@{'/admin/autore/' + ${autore.id} + '/modifica'}" method="post">
            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" th:value="${autore.nome}" required />
            </div>

            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" th:value="${autore.cognome}" />
            </div>

            <div class="form-group">
                <label for="nazionalita">Nazionalità *</label>
                <input type="text" id="nazionalita" name="nazionalita" th:value="${autore.nazionalita}" required />
            </div>

            <div class="form-group">
                <label for="dataNascita">Data di nascita *</label>
                <input type="date" id="dataNascita" name="dataNascita"
                       th:value="${autore.dataNascita}" required />
            </div>

            <div class="form-group">
                <label for="dataMorte">Data di morte (facoltativa)</label>
                <input type="date" id="dataMorte" name="dataMorte"
                       th:value="${autore.dataMorte}" />
            </div>

            <div class="form-group">
                <label for="urlImmagine">URL immagine</label>
                <input type="text" id="urlImmagine" name="urlImmagine" th:value="${autore.urlImmagine}" />
            </div>

            <button type="submit">Salva modifiche</button>
            <a th:href="@{'/admin/autore/' + ${autore.id}}" class="btn-back">Annulla</a>
        </form>
    </div>
</body>
</html>
