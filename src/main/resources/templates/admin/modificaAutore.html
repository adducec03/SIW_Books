
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Autore - SIW Books</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffe6a7;
            color: #432818;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #432818 0%, #99582a 100%);
            padding: 1.5rem 0;
            box-shadow: 0 4px 20px rgba(67, 40, 24, 0.15);
            margin-bottom: 2rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffe6a7;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .logo {
            height: 50px;
            width: auto;
            margin-right: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            margin-left: auto;
        }

        .nav-link {
            color: #ffe6a7;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover {
            background-color: rgba(255, 230, 167, 0.1);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #432818;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(67, 40, 24, 0.1);
        }

        .page-subtitle {
            color: #99582a;
            font-size: 1.1rem;
        }

        /* Form Container */
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 12px 40px rgba(67, 40, 24, 0.15);
            border: 2px solid rgba(153, 88, 42, 0.1);
            margin-bottom: 2rem;
        }

        /* Error Message */
        .error-message {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #dc2626;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 2px solid #fca5a5;
            font-weight: 500;
        }

        .error-message p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message p::before {
            content: "⚠️";
            font-size: 1.2rem;
        }

        /* Form Styles */
        .form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-weight: 600;
            color: #432818;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .required::after {
            content: "*";
            color: #dc2626;
            margin-left: 0.25rem;
        }

        .form-input,
        .form-textarea {
            padding: 1rem;
            border: 2px solid rgba(153, 88, 42, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            background: #ffe6a7;
            color: #432818;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #99582a;
            box-shadow: 0 0 0 3px rgba(153, 88, 42, 0.1);
            transform: translateY(-2px);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(67, 40, 24, 0.6);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* File Input Styles */
        .file-input-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem;
            background: linear-gradient(135deg, #99582a 0%, #6f1d1b 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(153, 88, 42, 0.3);
        }

        .file-icon {
            font-size: 1.2rem;
        }

        .file-help-text {
            color: #99582a;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Action Buttons */
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #432818;
            border: 2px solid #99582a;
        }

        .btn-secondary:hover {
            background: #99582a;
            color: white;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .form-container {
                padding: 2rem;
                margin: 0 1rem;
            }

            .main-content {
                padding: 0 1rem;
            }

            .header-container {
                padding: 0 1rem;
            }

            .nav-links {
                display: none;
            }

            .page-title {
                font-size: 2rem;
            }

            .form-actions {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container {
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Focus States */
        .form-input:focus + .form-label,
        .form-textarea:focus + .form-label {
            color: #99582a;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo-link">
                <span>SIW Books</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/libri" class="nav-link">Catalogo</a>
                <a href="/autori" class="nav-link">Autori</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Modifica Autore</h1>
            <p class="page-subtitle">Aggiorna le informazioni dell'autore</p>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <!-- Error Message -->
            <div th:if="${dataError}" class="error-message">
                <p th:text="${dataError}">Errore nel salvataggio dei dati</p>
            </div>

            <!-- Form -->
            <form th:action="@{'/admin/autore/' + ${autore.id} + '/modifica'}" method="post" th:object="${autore}" enctype="multipart/form-data" class="form">
                
                <!-- Nome e Cognome -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome" class="form-label required">
                            👤 Nome
                        </label>
                        <input type="text" 
                               id="nome" 
                               name="nome" 
                               th:value="${autore.nome}" 
                               class="form-input" 
                               placeholder="Inserisci il nome"
                               required />
                    </div>

                    <div class="form-group">
                        <label for="cognome" class="form-label">
                            👤 Cognome
                        </label>
                        <input type="text" 
                               id="cognome" 
                               name="cognome" 
                               th:value="${autore.cognome}" 
                               class="form-input" 
                               placeholder="Inserisci il cognome" />
                    </div>
                </div>

                <!-- Nazionalità -->
                <div class="form-group">
                    <label for="nazionalita" class="form-label required">
                        🌍 Nazionalità
                    </label>
                    <input type="text" 
                           id="nazionalita" 
                           name="nazionalita" 
                           th:value="${autore.nazionalita}" 
                           class="form-input" 
                           placeholder="Es. Italiana, Francese, Americana"
                           required />
                </div>

                <!-- Date -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="dataNascita" class="form-label required">
                            🎂 Data di nascita
                        </label>
                        <input type="date" 
                               id="dataNascita" 
                               name="dataNascita" 
                               th:value="${autore.dataNascita}" 
                               class="form-input" 
                               required />
                    </div>

                    <div class="form-group">
                        <label for="dataMorte" class="form-label">
                            ⚰️ Data di morte (facoltativa)
                        </label>
                        <input type="date" 
                               id="dataMorte" 
                               name="dataMorte" 
                               th:value="${autore.dataMorte}" 
                               class="form-input" />
                    </div>
                </div>

                <!-- Immagine -->
                <div class="form-group">
                    <label for="immagine" class="form-label">
                        📷 Immagine autore
                    </label>
                    <div class="file-input-container">
                        <input type="file" 
                               id="immagine" 
                               name="immagine" 
                               accept="image/*" 
                               class="file-input">
                        <label for="immagine" class="file-input-label">
                            <span class="file-icon">📷</span>
                            Seleziona un'immagine
                        </label>
                    </div>
                    <div class="file-help-text">
                        Formati supportati: JPG, PNG, GIF. Massimo 5MB per immagine.
                    </div>
                </div>

                <!-- Descrizione -->
                <div class="form-group full-width">
                    <label for="descrizione" class="form-label">
                        📖 Biografia
                    </label>
                    <textarea id="descrizione"
                              name="descrizione"
                              th:field="*{descrizione}"
                              class="form-textarea"
                              placeholder="Scrivi una breve biografia dell'autore..."
                              rows="6"></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" 
                          th:errors="*{descrizione}" 
                          class="error-message"></span>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        💾 Salva modifiche
                    </button>
                    <a th:href="@{'/admin/autore/' + ${autore.id}}" class="btn btn-secondary">
                        ❌ Annulla
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
