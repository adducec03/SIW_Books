<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica Autore</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container">
        <h1>Modifica Autore</h1>

        <!-- Mostra errore se presente -->
        <div th:if="${dataError}" class="error-message" style="color: red;">
            <p th:text="${dataError}"></p>
        </div>

        <form th:action="@{'/admin/autore/' + ${autore.id} + '/modifica'}" method="post" th:object="${autore}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" th:value="${autore.nome}" required />
            </div>

            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" th:value="${autore.cognome}" />
            </div>

            <div class="form-group">
                <label for="nazionalita">Nazionalità *</label>
                <input type="text" id="nazionalita" name="nazionalita" th:value="${autore.nazionalita}" required />
            </div>

            <div class="form-group">
                <label for="dataNascita">Data di nascita *</label>
                <input type="date" id="dataNascita" name="dataNascita" th:value="${autore.dataNascita}" required />
            </div>

            <div class="form-group">
                <label for="dataMorte">Data di morte (facoltativa)</label>
                <input type="date" id="dataMorte" name="dataMorte" th:value="${autore.dataMorte}" />
            </div>

            <div class="form-group">
            <label for="immagini" class="form-label">Immagine autore</label>
            <div class="file-input-container">
                <input type="file" id="immagine" name="immagine" accept="image/*" class="file-input">
                <label for="immagine" class="file-input-label">
                    <span class="file-icon">📷</span>
                    Seleziona un immagine
                </label>
            </div>
            <small style="color: var(--secondary-color); font-size: 0.875rem; margin-top: 0.25rem; display: block;">
                Formati supportati: JPG, PNG, GIF. Massimo 5MB per immagine.
            </small>
        </div>
        <div>

            <div>
                <label>Descrizione:</label>
                <textarea th:field="*{descrizione}" rows="6" cols="50"></textarea>
                <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"></span>
            </div>

            <button type="submit">Salva modifiche</button>
            <a th:href="@{'/admin/autore/' + ${autore.id}}" class="btn-back">Annulla</a>
        </form>
    </div>
</body>

</html>
