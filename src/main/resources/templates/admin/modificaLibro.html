
<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Libro - SIW Books</title>
    <link rel="stylesheet" href="/css/modificaLibroAndAutore.css?version=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo-container">
                <span class="brand-text">SIW Books</span>
            </a>
            <nav>
                <a href="/libri" class="nav-link">Torna al Catalogo</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="page-header">
            <h1 class="page-title">Modifica Libro</h1>
            <p class="page-subtitle">Aggiorna le informazioni del libro nel sistema</p>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/libro/{id}(id=${libro.id})}" th:object="${libro}" method="post" enctype="multipart/form-data">
                
                <!-- Title and Year and genre Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="titolo" class="form-label">Titolo *</label>
                        <input type="text" id="titolo" th:field="*{titolo}" class="form-input" 
                               placeholder="Inserisci il titolo del libro">
                        <span th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="anno" class="form-label">Anno di Pubblicazione *</label>
                        <input type="number" id="anno" th:field="*{anno}" class="form-input" 
                               placeholder="es. 2023" min="1" max="2024">
                        <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="genere" class="form-label">Genere</label>
                        <input type="text" id="genere" th:field="*{genere}" class="form-input" 
                               placeholder="es. Narrativa">
                        <span th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}" class="field-error"></span>
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="descrizione" class="form-label">Trama</label>
                    <textarea id="descrizione" th:field="*{descrizione}" class="form-input form-textarea"
                              placeholder="Inserisci una breve descrizione del libro, trama o riassunto..."></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="field-error"></span>
                </div>

                <!-- Authors Selection -->
                <div class="form-group">
                    <label for="autori" class="form-label">Seleziona Autori *</label>
                    <select id="autori" th:field="*{autori}" multiple size="5" class="form-input form-select">
                        <option th:each="autore : ${autori}" th:value="${autore.id}"
                                th:text="${autore.nome + ' ' + autore.cognome}">
                            Autore Nome
                        </option>
                    </select>
                    <small class="helper-text">
                        Tieni premuto Ctrl (o Cmd su Mac) per selezionare più autori
                    </small>
                </div>

                <!-- Existing Images Section -->
                <div class="images-section">
                    <h3 class="section-title">
                        <span class="section-icon">🖼️</span>
                        Immagini Esistenti
                    </h3>
                    
                    <div th:if="${libro.percorsiImmagini != null and !libro.percorsiImmagini.isEmpty()}">
                        <ul class="images-grid">
                            <li class="image-item" th:each="url, iterStat : ${libro.percorsiImmagini}">
                                <img th:src="@{${url}}" alt="Immagine libro" class="image-preview" />
                                <input type="hidden" th:name="existingImages" th:value="${url}" />
                                <div class="remove-checkbox-container">
                                    <input type="checkbox" th:name="removeIndexes" th:value="${iterStat.index}" 
                                           class="remove-checkbox" id="remove-${iterStat.index}" />
                                    <label th:for="'remove-' + ${iterStat.index}">Rimuovi</label>
                                </div>
                            </li>
                        </ul>
                    </div>
                    
                    <div th:unless="${libro.percorsiImmagini != null and !libro.percorsiImmagini.isEmpty()}" 
                         class="no-images">
                        <p>Nessuna immagine presente per questo libro.</p>
                    </div>
                </div>

                <!-- Add New Images -->
                <div class="form-group">
                    <label for="immagini" class="form-label">Aggiungi Nuove Immagini</label>
                    <div class="file-input-container">
                        <input type="file" id="immagini" name="immagini" multiple accept="image/*" class="file-input">
                        <label for="immagini" class="file-input-label">
                            <span class="file-icon">📷</span>
                            Seleziona nuove immagini
                        </label>
                    </div>
                    <small class="helper-text">
                        Formati supportati: JPG, PNG, GIF. Massimo 5MB per immagine.
                    </small>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <a href="/libri" class="btn btn-secondary">Annulla</a>
                    <button type="submit" class="btn btn-primary">
                        💾 Salva Modifiche
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // File input enhancement
        document.getElementById('immagini').addEventListener('change', function(e) {
            const label = document.querySelector('.file-input-label');
            const fileCount = e.target.files.length;
            
            if (fileCount > 0) {
                label.innerHTML = `<span class="file-icon">📷</span> ${fileCount} nuov${fileCount > 1 ? 'e' : 'a'} immagin${fileCount > 1 ? 'i' : 'e'} selezionat${fileCount > 1 ? 'e' : 'a'}`;
                label.style.borderColor = 'var(--success-color)';
                label.style.color = 'var(--success-color)';
            } else {
                label.innerHTML = '<span class="file-icon">📷</span> Seleziona nuove immagini';
                label.style.borderColor = 'var(--border-color)';
                label.style.color = 'var(--secondary-color)';
            }
        });

        // Form validation enhancement
        document.querySelector('form').addEventListener('submit', function(e) {
            const requiredFields = document.querySelectorAll('input[required], select[required]');
            let hasErrors = false;

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = 'var(--error-color)';
                    hasErrors = true;
                } else {
                    field.style.borderColor = 'var(--border-color)';
                }
            });

            if (hasErrors) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        // Remove image checkbox styling enhancement
        document.querySelectorAll('.remove-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const imageItem = this.closest('.image-item');
                if (this.checked) {
                    imageItem.style.opacity = '0.5';
                    imageItem.style.filter = 'grayscale(100%)';
                } else {
                    imageItem.style.opacity = '1';
                    imageItem.style.filter = 'none';
                }
            });
        });
    </script>
</body>
</html>
