<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica Libro</title>
</head>

<body>
    <h1>Modifica libro</h1>

    <form th:action="@{/admin/libro/{id}(id=${libro.id})}" th:object="${libro}" method="post"
        enctype="multipart/form-data">

        <label for="titolo">Titolo:</label>
        <input type="text" id="titolo" th:field="*{titolo}" required /><br />

        <label for="anno">Anno di pubblicazione:</label>
        <input type="number" id="anno" th:field="*{anno}" required /><br />

        <div>
            <label for="descrizione">Descrizione:</label><br>
            <textarea id="descrizione" th:field="*{descrizione}" rows="5" cols="60"></textarea>
            <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"></span>
        </div>

        <div>
            <label>Autori:</label>
            <select th:field="*{autori}" multiple>
                <option th:each="autore : ${autori}" th:value="${autore.id}"
                    th:text="${autore.nome + ' ' + autore.cognome}">
                </option>
            </select>
        </div>

        <h3>Immagini esistenti</h3>
        <ul>
            <li th:each="url, iterStat : ${libro.percorsiImmagini}">
                <img th:src="@{${url}}" style="height: 100px;" />
                <input type="hidden" th:name="existingImages" th:value="${url}" />
                <label>
                    Rimuovi:
                    <input type="checkbox" th:name="removeIndexes" th:value="${iterStat.index}" />
                </label>
            </li>
        </ul>

        <label for="immagini">Aggiungi immagini:</label>
        <input type="file" name="immagini" multiple />
        <!-- puoi aggiungere JS per aggiungerne dinamicamente -->


        <button type="submit">Salva</button>
    </form>
</body>

</html>
