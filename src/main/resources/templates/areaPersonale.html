<a href="/areaPersonale/modifica">Modifica i tuoi dati</a>

<h2>I tuoi libri salvati</h2>
<ul>
    <li th:each="libro : ${libriSalvati}">
        <a th:href="@{'/libro/' + ${libro.id}}" th:text="${libro.titolo}"></a>

        <form th:action="@{'/libro/' + ${libro.id} + '/unsave'}" method="post" style="display:inline;">
            <button type="submit">Rimuovi</button>
        </form>
    </li>
</ul>

<h2>Le tue recensioni</h2>
<ul>
    <li th:each="recensione : ${recensioni}">
        <span th:text="${recensione.libro.titolo}"></span>:
        <strong th:text="${recensione.voto}">0</strong> stelle
        <p th:text="${recensione.descrizione}"></p>
    </li>
</ul>
