<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Recensione - SIW Books</title>
    <link rel="stylesheet" href="/css/formNewRecensione.css?version=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">


</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <a href="/" class="brand-link">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2L2 7V17C2 18.1 2.9 19 4 19H20C21.1 19 22 18.1 22 17V7L12 2ZM12 4.84L19 8.31V17H5V8.31L12 4.84Z" />
                    </svg>
                    <span class="brand-text">
                        <span class="brand-main">SIW</span>
                        <span class="brand-sub">Books</span>
                    </span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Scrivi una Recensione</h1>
            <p class="page-subtitle">Condividi la tua opinione su questo libro</p>
        </div>

        <div class="form-container">
            <form th:action="@{/recensioni}" th:object="${recensione}" method="post" id="reviewForm">
                <input type="hidden" th:field="*{libro.id}" />
                <input type="hidden" id="votoInput" th:field="*{voto}" />

                <div class="form-group">
                    <label for="titolo" class="form-label">Titolo della Recensione</label>
                    <input type="text" id="titolo" th:field="*{titolo}" class="form-input"
                        placeholder="Inserisci un titolo per la tua recensione..." required />
                    <div th:if="${#fields.hasErrors('titolo')}" class="error-message" th:errors="*{titolo}"></div>
                </div>

                <div class="form-group">
                    <label for="descrizione" class="form-label">La tua Recensione</label>
                    <textarea id="descrizione" th:field="*{descrizione}" class="form-input form-textarea"
                        placeholder="Scrivi qui la tua recensione dettagliata del libro..." required></textarea>
                    <div th:if="${#fields.hasErrors('descrizione')}" class="error-message" th:errors="*{descrizione}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Valutazione</label>
                    <div class="rating-container">
                        <div class="stars-container">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                        <div class="rating-text" id="ratingText">Seleziona una valutazione</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Pubblica Recensione</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const stars = document.querySelectorAll('.star');
            const ratingText = document.getElementById('ratingText');
            const votoInput = document.getElementById('votoInput');
            const form = document.getElementById('reviewForm');

            let currentRating = 0;

            const ratingMessages = {
                1: 'Pessimo - Non mi è piaciuto per niente',
                2: 'Scarso - Non lo consiglio',
                3: 'Sufficiente - Nella media',
                4: 'Buono - Lo consiglio',
                5: 'Eccellente - Assolutamente fantastico!'
            };

            stars.forEach((star, index) => {
                star.addEventListener('click', function () {
                    currentRating = parseInt(this.dataset.rating);
                    updateStars(currentRating);
                    updateRatingText(currentRating);
                    votoInput.value = currentRating;
                });

                star.addEventListener('mouseenter', function () {
                    const hoverRating = parseInt(this.dataset.rating);
                    updateStars(hoverRating);
                    updateRatingText(hoverRating);
                });
            });

            document.querySelector('.stars-container').addEventListener('mouseleave', function () {
                updateStars(currentRating);
                updateRatingText(currentRating);
            });

            function updateStars(rating) {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.classList.add('active');
                    } else {
                        star.classList.remove('active');
                    }
                });
            }

            function updateRatingText(rating) {
                if (rating === 0) {
                    ratingText.textContent = 'Seleziona una valutazione';
                } else {
                    ratingText.textContent = `${rating} stelle - ${ratingMessages[rating]}`;
                }
            }

            // Form validation
            form.addEventListener('submit', function (e) {
                if (currentRating === 0) {
                    e.preventDefault();
                    alert('Per favore seleziona una valutazione con le stelle prima di inviare la recensione.');
                }
            });
        });
    </script>
</body>

</html>
