<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Recensione - SIW Books</title>
    <link rel="stylesheet" href="/css/formNewRecensione.css?version=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">


</head>

<body>
    <!-- Header -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <a href="/" class="logo">
                    SIW Books
                </a>
            </div>

            <div class="navbar-nav">
                <a href="/">Home</a>
                <a href="/libri" class="active-page">
                    Libri
                </a>
                <a href="/autori">Autori</a>
            </div>

            <div class="navbar-auth">
                <span class="not-auth" sec:authorize="!isAuthenticated()">
                    <a href="/login">Login</a>
                    <a href="/register" class="btn-register">Register</a>
                </span>
                <div sec:authorize="isAuthenticated()">
                    <div class="profile-dropdown">
                        <div class="profile-icon" id="profileToggle">
                            <!-- Icona utente -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="28" height="28"
                                viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>

                            <span>Ciao, <span th:text="${nomeUtente}">Utente</span></span>
                        </div>
                        <div class="profile-menu" id="profileDropdown">
                            <a th:href="@{/areaPersonale}">
                                <!-- Icona impostazioni -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="20" height="20"
                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"
                                    style="vertical-align: middle; margin-right: 8px;">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                                </svg>


                                Area Personale
                            </a>

                            <a th:href="@{/logout}">
                                <!-- Icona logout -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24"
                                    style="vertical-align: middle; margin-right: 8px;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">


        <div class="form-container">

            <div class="page-header">
                <h1 class="page-title">Scrivi una Recensione</h1>
                <p class="page-subtitle">Condividi la tua opinione su questo libro</p>
            </div>
            <form th:action="@{/recensioni}" th:object="${recensione}" method="post" id="reviewForm">
                <input type="hidden" th:field="*{libro.id}" />
                <input type="hidden" id="votoInput" th:field="*{voto}" />

                <div class="form-group">
                    <label for="titolo" class="form-label">Titolo della Recensione</label>
                    <input type="text" id="titolo" th:field="*{titolo}" class="form-input"
                        placeholder="Inserisci un titolo per la tua recensione..." />
                    <div th:if="${#fields.hasErrors('titolo')}" class="error-message" th:errors="*{titolo}"></div>
                </div>

                <div class="form-group">
                    <label for="descrizione" class="form-label">La tua Recensione</label>
                    <textarea id="descrizione" th:field="*{descrizione}" class="form-input form-textarea"
                        placeholder="Scrivi qui la tua recensione dettagliata del libro..."></textarea>
                    <div th:if="${#fields.hasErrors('descrizione')}" class="error-message" th:errors="*{descrizione}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Valutazione</label>
                    <div class="rating-container">
                        <div class="stars-container">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                        <div class="rating-text" id="ratingText">Seleziona una valutazione</div>
                        <div th:if="${#fields.hasErrors('voto')}" class="error-message" th:errors="*{voto}"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Pubblica Recensione</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const stars = document.querySelectorAll('.star');
            const ratingText = document.getElementById('ratingText');
            const votoInput = document.getElementById('votoInput');
            const form = document.getElementById('reviewForm');

            let currentRating = 0;

            const ratingMessages = {
                1: 'Pessimo - Non mi è piaciuto per niente',
                2: 'Scarso - Non lo consiglio',
                3: 'Sufficiente - Nella media',
                4: 'Buono - Lo consiglio',
                5: 'Eccellente - Assolutamente fantastico!'
            };

            stars.forEach((star, index) => {
                star.addEventListener('click', function () {
                    currentRating = parseInt(this.dataset.rating);
                    updateStars(currentRating);
                    updateRatingText(currentRating);
                    votoInput.value = currentRating;
                });

                star.addEventListener('mouseenter', function () {
                    const hoverRating = parseInt(this.dataset.rating);
                    updateStars(hoverRating);
                    updateRatingText(hoverRating);
                });
            });

            document.querySelector('.stars-container').addEventListener('mouseleave', function () {
                updateStars(currentRating);
                updateRatingText(currentRating);
            });

            function updateStars(rating) {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.classList.add('active');
                    } else {
                        star.classList.remove('active');
                    }
                });
            }

            function updateRatingText(rating) {
                if (rating === 0) {
                    ratingText.textContent = 'Seleziona una valutazione';
                } else {
                    ratingText.textContent = ratingMessages[rating];
                }
            }

        });

        document.addEventListener('DOMContentLoaded', function () {
            const toggle = document.getElementById('profileToggle');
            const dropdown = document.getElementById('profileDropdown');

            if (toggle && dropdown) {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
                });

                document.addEventListener('click', function () {
                    dropdown.style.display = 'none';
                });
            }
        });
    </script>
</body>

</html>
