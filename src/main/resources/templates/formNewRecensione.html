
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Recensione - SIW Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffe6a7;
            color: #432818;
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background-color: #432818;
            padding: 1rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 2px 10px rgba(67, 40, 24, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-link {
            color: #ffe6a7;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.5rem;
            transition: opacity 0.2s ease;
        }

        .brand-link:hover {
            opacity: 0.8;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-main {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 0.875rem;
            font-weight: 400;
            opacity: 0.8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #432818;
            margin-bottom: 1rem;
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: #99582a;
            font-weight: 400;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(67, 40, 24, 0.1);
            border: 2px solid rgba(153, 88, 42, 0.1);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #432818;
            margin-bottom: 0.75rem;
            font-size: 1.125rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(153, 88, 42, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            background-color: #fefefe;
            color: #432818;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: #99582a;
            box-shadow: 0 0 0 3px rgba(153, 88, 42, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Inter', sans-serif;
        }

        .rating-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }

        .stars-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .star {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .star:hover,
        .star.active {
            color: #99582a;
            transform: scale(1.1);
        }

        .star:hover {
            text-shadow: 0 0 10px rgba(153, 88, 42, 0.3);
        }

        .rating-text {
            font-size: 1rem;
            color: #99582a;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, #6f1d1b 0%, #99582a 100%);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto 0;
            box-shadow: 0 4px 15px rgba(111, 29, 27, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(111, 29, 27, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .hidden-input {
            display: none;
        }

        .error-message {
            color: #6f1d1b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(111, 29, 27, 0.1);
            border-radius: 8px;
            border-left: 4px solid #6f1d1b;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .form-container {
                padding: 2rem 1.5rem;
                border-radius: 15px;
            }

            .page-title {
                font-size: 2rem;
            }

            .header-container {
                padding: 0 1rem;
            }

            .brand-main {
                font-size: 1.25rem;
            }

            .brand-sub {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <a href="/" class="brand-link">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7V17C2 18.1 2.9 19 4 19H20C21.1 19 22 18.1 22 17V7L12 2ZM12 4.84L19 8.31V17H5V8.31L12 4.84Z"/>
                    </svg>
                    <span class="brand-text">
                        <span class="brand-main">SIW</span>
                        <span class="brand-sub">Books</span>
                    </span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Scrivi una Recensione</h1>
            <p class="page-subtitle">Condividi la tua opinione su questo libro</p>
        </div>

        <div class="form-container">
            <form th:action="@{/recensioni}" th:object="${recensione}" method="post" id="reviewForm">
                <input type="hidden" th:field="*{libro.id}" />
                <input type="hidden" id="votoInput" th:field="*{voto}" />

                <div class="form-group">
                    <label for="titolo" class="form-label">Titolo della Recensione</label>
                    <input type="text" 
                           id="titolo" 
                           th:field="*{titolo}" 
                           class="form-input" 
                           placeholder="Inserisci un titolo per la tua recensione..."
                           required />
                    <div th:if="${#fields.hasErrors('titolo')}" class="error-message" th:errors="*{titolo}"></div>
                </div>

                <div class="form-group">
                    <label for="descrizione" class="form-label">La tua Recensione</label>
                    <textarea id="descrizione" 
                              th:field="*{descrizione}" 
                              class="form-input form-textarea" 
                              placeholder="Scrivi qui la tua recensione dettagliata del libro..."
                              required></textarea>
                    <div th:if="${#fields.hasErrors('descrizione')}" class="error-message" th:errors="*{descrizione}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Valutazione</label>
                    <div class="rating-container">
                        <div class="stars-container">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                        <div class="rating-text" id="ratingText">Seleziona una valutazione</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Pubblica Recensione</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stars = document.querySelectorAll('.star');
            const ratingText = document.getElementById('ratingText');
            const votoInput = document.getElementById('votoInput');
            const form = document.getElementById('reviewForm');
            
            let currentRating = 0;
            
            const ratingMessages = {
                1: 'Pessimo - Non mi è piaciuto per niente',
                2: 'Scarso - Non lo consiglio',
                3: 'Sufficiente - Nella media',
                4: 'Buono - Lo consiglio',
                5: 'Eccellente - Assolutamente fantastico!'
            };
            
            stars.forEach((star, index) => {
                star.addEventListener('click', function() {
                    currentRating = parseInt(this.dataset.rating);
                    updateStars(currentRating);
                    updateRatingText(currentRating);
                    votoInput.value = currentRating;
                });
                
                star.addEventListener('mouseenter', function() {
                    const hoverRating = parseInt(this.dataset.rating);
                    updateStars(hoverRating);
                    updateRatingText(hoverRating);
                });
            });
            
            document.querySelector('.stars-container').addEventListener('mouseleave', function() {
                updateStars(currentRating);
                updateRatingText(currentRating);
            });
            
            function updateStars(rating) {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.classList.add('active');
                    } else {
                        star.classList.remove('active');
                    }
                });
            }
            
            function updateRatingText(rating) {
                if (rating === 0) {
                    ratingText.textContent = 'Seleziona una valutazione';
                } else {
                    ratingText.textContent = `${rating} stelle - ${ratingMessages[rating]}`;
                }
            }
            
            // Form validation
            form.addEventListener('submit', function(e) {
                if (currentRating === 0) {
                    e.preventDefault();
                    alert('Per favore seleziona una valutazione con le stelle prima di inviare la recensione.');
                }
            });
        });
    </script>
</body>

</html>
