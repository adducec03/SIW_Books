<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Navbar Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #eee;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #432818;
            color: #ffe6a7;
            padding: 1rem 2rem;
            position: relative;
        }

        .profile-dropdown {
            position: relative;
            display: inline-block;
        }

        .profile-icon {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: #ffe6a7;
        }

        .profile-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: #fff7e6;
            min-width: 160px;
            border-radius: 0.5rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            opacity: 0;
            max-height: 0;
            visibility: hidden;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .profile-menu.show {
            opacity: 1;
            visibility: visible;
            max-height: 200px;
        }

        .profile-menu a {
            display: block;
            padding: 12px 16px;
            color: #432818;
            text-decoration: none;
        }

        .profile-menu a:hover {
            background: #ffe6a7;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="navbar-left">SIW Books</div>
        <div class="navbar-right">
            <div class="profile-dropdown">
                <div id="profileToggle" style="cursor:pointer; background: red; padding: 1rem;">
                    Cliccami
                </div>
                <div class="profile-menu" id="profileDropdown">
                    <a href="#">Area Personale</a>
                    <a href="#">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById('profileToggle');
            const dropdown = document.getElementById('profileDropdown');

            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            });

            document.addEventListener('click', function () {
                dropdown.classList.remove('show');
            });
        });
    </script>

</body>

</html>
