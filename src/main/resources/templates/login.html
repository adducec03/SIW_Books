<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIW Books</title>
    <link rel="preload" as="image" href="/images/wallpaper2.png">
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="image-wrapper">
        <img src="/images/wallpaper2.png" class="bg-image" alt="Sfondo" />
    </div>

    <a href="/" class="home-link" aria-label="Torna alla home">
        <i class="fas fa-home"></i>
    </a>

    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <form th:action="@{/login}" method="post">
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div th:if="${param.error}" class="error-msg">
                    Credenziali non valide
                </div>
                <button type="submit" class="login-btn"><span>Login</span></button>
            </form>

            <p class="divider">Oppure accedi con</p>
            <div class="social-icons">
                <a href="/oauth2/authorization/google" class="google"><i class="fab fa-google"></i></a>
                <a href="/oauth2/authorization/github" class="github"><i class="fab fa-github"></i></a>
            </div>

            <p class="signup-text">Non hai un account? <a href="/register">Registrati!</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                // Anima il box di login
                const loginBox = document.querySelector('.login-container');
                if (loginBox) {
                    loginBox.classList.add('animate');
                }

                // Anima l'icona della home (assicurati che abbia la classe .home-link)
                const homeIcon = document.querySelector('.home-link');
                if (homeIcon) {
                    homeIcon.classList.add('animate');
                }
            }, 100); // Ritardo per dare effetto fluido
        });
        const bg = document.querySelector('.bg-image');
        bg.addEventListener('load', () => {
            bg.classList.add('loaded');
        });
    </script>

</body>

</html>
