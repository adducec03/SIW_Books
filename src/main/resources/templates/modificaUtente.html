<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica Dati Utente - Libreria Digitale</title>
    <link rel="stylesheet" href="/css/modificaUtente.css" />
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/">
            SIW Books</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">




        <!-- Edit Form -->
        <div class="form-container">
            <div class="form-header">
                <h3>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Informazioni Personali
                </h3>
            </div>
            <div class="page-title">
                <h2>Modifica Dati Utente</h2>
                <p>Aggiorna le tue informazioni personali</p>
            </div>

            <form class="form-content" th:object="${modificaUtenteDTO}" th:action="@{/areaPersonale/modifica}"
                method="post">
                <!-- Nome e Cognome Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" th:field="*{nome}" />
                        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="cognome">Cognome *</label>
                        <input type="text" th:field="*{cognome}" />
                        <div th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="error-message"></div>
                    </div>
                </div>

                <!-- Telefono -->
                <div class="form-group">
                    <label for="telefono">Numero di Telefono</label>
                    <input type="tel" th:field="*{numeroTelefonico}" />
                </div>

                <!-- Account Settings (Non-OAuth) -->
                <div th:if="${isOAuth == false}" class="credentials-section">
                    <h4 class="section-title">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Credenziali di Accesso
                    </h4>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" th:field="*{email}" />
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" th:field="*{username}" />
                        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username">Vecchia Password</label>
                        <input type="password" name="oldPassword" placeholder="Vecchia password">
                    </div>

                    <div class="form-group">
                        <label for="username">Nuova Password</label>
                        <input type="password" name="newPassword" placeholder="Nuova password">
                    </div>

                    <div class="form-group">
                        <label for="username">Conferma Password</label>
                        <input type="password" name="confirmPassword" placeholder="Conferma nuova password">
                    </div>

                    <div th:if="${passwordError}" class="error-message" th:text="${passwordError}"></div>










                </div>

                <!-- Action Buttons -->
                <div class="button-row">
                    <button type="submit" class="btn-primary">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Salva Modifiche
                    </button>

                    <a href="/areaPersonale" class="btn-secondary">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Torna all'Area Personale
                    </a>
                </div>
            </form>
        </div>

        <!-- Additional Info -->
        <div class="footer-info">
            <p>
                I tuoi dati sono protetti e utilizzati secondo la nostra
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&ab_channel=RickAstley">Privacy Policy</a>
            </p>
        </div>
    </main>


</body>

</html>
