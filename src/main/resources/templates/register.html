<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione | SIW Books</title>
    <link rel="preload" as="image" href="/images/wallpaper2.png">
    <link rel="stylesheet" href="/css/register.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="image-wrapper">
        <img src="/images/wallpaper2.png" class="bg-image" alt="Sfondo">
    </div>

    <a href="/" class="home-link" aria-label="Torna alla home">
        <i class="fas fa-home"></i>
    </a>

    <div class="register-container">
        <div class="register-box">
            <h2>Registrazione</h2>

            <form th:action="@{/register}" method="POST" th:object="${credentials}">

                <div class="input-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{utente.nome}" placeholder="Nome" />
                    <div th:if="${#fields.hasErrors('utente.nome')}" th:errors="*{utente.nome}" class="error-message"></div>
                </div>

                <div class="input-group">
                    <label>Cognome</label>
                    <input type="text" th:field="*{utente.cognome}" placeholder="Cognome" />
                    <div th:if="${#fields.hasErrors('utente.cognome')}" th:errors="*{utente.cognome}" class="error-message"></div>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" th:field="*{utente.email}" placeholder="Email"/>
                    <div th:if="${#fields.hasErrors('utente.email')}" th:errors="*{utente.email}" class="error-message"></div>
                </div>

                <div class="input-group">
                    <label>Numero di telefono</label>
                    <input type="number" th:field="*{utente.numeroTelefonico}" placeholder="Opzionale" />
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" placeholder="Username"/>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" placeholder="Password"/>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
                </div>

                <button type="submit" class="register-btn"><span>Registrati</span></button>
            </form>

            <p class="signup-text">Hai già un account? <a href="/login">Accedi</a></p>
        </div>
    </div>

    <script>
        // Attiva animazione registrazione
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                // Anima il box di login
                const loginBox = document.querySelector('.register-container');
                if (loginBox) {
                    loginBox.classList.add('animate');
                }

                // Anima l'icona della home (assicurati che abbia la classe .home-link)
                const homeIcon = document.querySelector('.home-link');
                if (homeIcon) {
                    homeIcon.classList.add('animate');
                }
            }, 100); // Ritardo per dare effetto fluido
        });

        // Fade-in immagine background
        const bg = document.querySelector('.bg-image');
        if (bg) {
            bg.addEventListener('load', () => {
                bg.classList.add('loaded');
            });
        }
    </script>
</body>

</html>
