<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrazione</title>
    <link rel="stylesheet" href="/stile.css?version=3" />
</head>
<body>
    <div><a href="/"><img src="/logo.png" width="10%" /></a></div>
    <h1>Registrazione</h1>

    <form th:action="@{/register}" method="POST" th:object="${credentials}">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div>
            <label>*Nome:</label>
            <input type="text" th:field="*{utente.nome}" required />
        </div>

        <div>
            <label>*Cognome:</label>
            <input type="text" th:field="*{utente.cognome}" required />
        </div>

        <div>
            <label>*Username:</label>
            <input type="text" th:field="*{username}" required />
        </div>

        <div>
            <label>*Password:</label>
            <input type="password" th:field="*{password}" required />
        </div>

        <div>
            <label>Numero di telefono:</label>
            <input type="numeroTelefonico" th:field="*{utente.numeroTelefonico}" />
        </div>

        <div>
            <button type="submit">Registrati</button>
        </div>
    </form>
</body>
</html>
